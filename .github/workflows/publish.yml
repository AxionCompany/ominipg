name: Publish
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate release tag
        run: >-
          deno run --allow-read=deno.json scripts/validate_publish_release.ts
          "${{ github.ref_name }}" "${{ github.ref }}"
      - name: Verify release
        run: deno task verify
      - name: Publish package
        run: npx jsr publish
