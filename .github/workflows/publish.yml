name: Publish
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check package version
        id: release
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const manifest = JSON.parse(readFileSync("deno.json", "utf8"));
          const response = await fetch(
            `https://jsr.io/${manifest.name}/meta.json`,
          );
          if (!response.ok) {
            throw new Error(
              `Unable to read JSR metadata: ${response.status} ${response.statusText}`,
            );
          }

          const metadata = await response.json();
          const shouldPublish = !Object.hasOwn(
            metadata.versions ?? {},
            manifest.version,
          );
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `version=${manifest.version}\npublish=${shouldPublish}\n`,
          );
          console.log(
            shouldPublish
              ? `Publishing ${manifest.name}@${manifest.version}`
              : `${manifest.name}@${manifest.version} is already published`,
          );
          NODE
      - name: Verify release
        if: steps.release.outputs.publish == 'true'
        run: deno task verify
      - name: Publish package
        if: steps.release.outputs.publish == 'true'
        run: npx jsr publish
